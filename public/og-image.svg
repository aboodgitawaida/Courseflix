  <text x="88" y="365" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900">Courseflix</text>
  <text x="94" y="430" fill="#d4d4d8" font-family="Arial, Helvetica, sans-serif" font-size=" thirty" font-size="30">Discover UTM courses like Netflix.</text>
  <rect x="94" y="485" width="150" height="6" rx="3" fill="#e50914" />
