<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Courseflix — Discover UTM courses like Netflix</title>
  <desc id="desc">A Netflix-style course discovery platform for University of Toronto Mississauga students.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b" />
      <stop offset="1" stop-color="#1c0b0d" />
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="70%">
      <stop offset="0" stop-color="#e50914" stop-opacity=".45" />
      <stop offset="1" stop-color="#e50914" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <g fill="none" stroke="#e50914" stroke-opacity=".18" stroke-width="2">
    <path d="M760 80h310v210H760z" />
    <path d="M820 140h310v210H820z" />
