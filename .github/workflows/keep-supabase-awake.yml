name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity, which takes
# ratings, sign-in and shortlists offline. This makes one tiny read-only request
# every 3 days so the project never goes idle. It never writes or changes data.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL              e.g. https://abcd1234.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the public anon/publishable key (same as in Vercel)

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the rating stats view
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/course_rating_stats?select=course_code&limit=1" \
            > /dev/null
          echo "Supabase responded; project stays active."
